[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "emg_tools.__version__"}

[project]
name = "emg-tools"
dynamic = ["version"]
description = "Preprocess, analyse and plot EMG signals"
authors = [
    {name = "Irene Mendez Guerra"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "seaborn>=0.11",
]

[project.urls]
Homepage = "https://imendezguerra.github.io/emg-tools/"
Documentation = "https://imendezguerra.github.io/emg-tools/"
Source = "https://github.com/imendezguerra/emg-tools"
Issues = "https://github.com/imendezguerra/emg-tools/issues"
Changelog = "https://github.com/imendezguerra/emg-tools/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
    "pre-commit>=3",
    "build>=1",
    "twine>=5",
]
docs = [
    "mkdocs>=1.6,<2",  # MkDocs 2.0 removes the plugin system that mkdocstrings needs
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "markdown-exec>=1.9",  # runs the getting-started examples and renders their plots
]

[tool.setuptools.packages.find]
include = ["emg_tools", "emg_tools.*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
markers = [
    "plot: matplotlib smoke tests",
]
filterwarnings = [
    "error",
    # Third-party deprecations we cannot act on
    "ignore::DeprecationWarning:seaborn.*",
    "ignore::DeprecationWarning:dateutil.*",
    # pyparsing>=3.3 deprecates camelCase names still used by matplotlib<3.10 (minimum-deps job)
    "ignore:.* deprecated - use .*:DeprecationWarning:matplotlib.*",
    "ignore:.* argument is deprecated, use .*:DeprecationWarning",
    # seaborn 0.11 compares versions with distutils LooseVersion (minimum-deps job)
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["emg_tools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.egg-info"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
    "PT",   # flake8-pytest-style
]
ignore = [
    "E501",   # line length is handled by the formatter
    "UP006",  # keep typing.List/Tuple style used across the package
    "UP007",  # keep Optional[...] / Union[...] style used across the package
    "UP035",  # same as above (deprecated typing imports)
    "UP045",  # same as above (Optional -> X | None)
]

[tool.ruff.lint.isort]
known-first-party = ["emg_tools"]
